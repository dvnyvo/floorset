# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2fb5e9454a99e3457755d42641c3acef"
application_url = "https://example.com"
embedded = true
name = "floorset"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_inventory,read_locations,read_orders"

# Floorset product attributes the rules engine reads (app-owned namespace: $app)
[product.metafields.app.color_family]
type = "single_line_text_field"
name = "Color family"
description = "black, navy, espresso, burgundy, olive, blue, red, grey, pink, lilac, cream or white"

  [product.metafields.app.color_family.access]
  admin = "merchant_read_write"

[product.metafields.app.category]
type = "single_line_text_field"
name = "Category"
description = "legging, bra, top, outerwear, short, jogger"

  [product.metafields.app.category.access]
  admin = "merchant_read_write"

[product.metafields.app.fixture_type]
type = "single_line_text_field"
name = "Fixture type"
description = "rail, table or both"

  [product.metafields.app.fixture_type.access]
  admin = "merchant_read_write"

[product.metafields.app.department]
type = "single_line_text_field"
name = "Department"
description = "womens or mens"

  [product.metafields.app.department.access]
  admin = "merchant_read_write"

[product.metafields.app.placement]
type = "single_line_text_field"
name = "Floor placement"
description = "Where the style sits on the sales floor, written by approved fixture swaps"

  [product.metafields.app.placement.access]
  admin = "merchant_read"

[sidekick]
extensions_summary = "Check RFID read rate and shrink, find floor items that need replacing, and list suspected loose tags"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Stock or product changes drop the cached catalog.
  [[webhooks.subscriptions]]
  uri = "/webhooks/catalog"
  topics = [ "inventory_levels/update", "products/update", "products/delete" ]

  # New orders feed sales velocity. Needs protected customer data access selected for the app in the
  # Partner Dashboard (no review for development stores); without it Shopify rejects this subscription.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
